<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Editar Proveedor - Nonna</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#5d1927",
                    "background-light": "#f8f6f6",
                    "background-dark": "#1f1316",
                    "brand-pink": "#FEBDC6",
                },
                fontFamily: { display: ["Plus Jakarta Sans", "sans-serif"] },
                borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            },
        },
    };
</script>
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FEBDC6; }
    .modal-mensaje { transition: opacity 0.3s ease, visibility 0.3s ease; }
</style>
</head>
<body class="bg-brand-pink min-h-screen flex items-center justify-center p-4">
<div class="relative w-full max-w-[1280px] bg-background-light rounded-xl shadow-2xl overflow-hidden flex flex-col" style="min-height:600px;">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-primary/10 px-10 py-6 bg-white">
        <div class="flex items-center gap-4">
            <div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white">
                <span style="font-size:1.25rem;">🍞</span>
            </div>
            <h2 class="text-primary text-2xl font-bold leading-tight tracking-tight">Nonna</h2>
        </div>
        <a href="proveedores.html" class="flex items-center justify-center rounded-full h-10 w-10 bg-primary/10 text-primary hover:bg-primary/20 transition-colors text-xl font-bold">✕</a>
    </header>

    <main class="flex-1 p-10">
        <div class="max-w-4xl mx-auto">
            <div class="mb-8">
                <h1 class="text-slate-900 text-4xl font-extrabold tracking-tight">Editar Proveedor</h1>
                <p class="text-primary/70 mt-2">Modifique los datos del proveedor y guarde los cambios.</p>
            </div>

            <div class="bg-white rounded-xl border border-primary/5 p-8 shadow-sm">
                <form id="form-editar" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="text-primary font-semibold text-sm uppercase tracking-wider">ID Proveedor</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-primary/50">🔍</span>
                                <input id="id_proveedor" class="w-full pl-11 pr-4 py-4 rounded-lg bg-primary/5 border-transparent text-primary font-medium cursor-not-allowed focus:ring-0 focus:border-transparent" type="text" readonly>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="text-primary font-semibold text-sm uppercase tracking-wider">Descripción *</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-primary">📝</span>
                                <input id="descripcion" class="w-full pl-11 pr-4 py-4 rounded-lg border-primary/20 bg-white text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all" type="text" required>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="text-primary font-semibold text-sm uppercase tracking-wider">Dirección</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-primary">📍</span>
                                <input id="direccion" class="w-full pl-11 pr-4 py-4 rounded-lg border-primary/20 bg-white text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all" type="text">
                            </div>
                        </div>
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="text-primary font-semibold text-sm uppercase tracking-wider">Contacto (Teléfono)</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-primary">📞</span>
                                <input id="contacto" class="w-full pl-11 pr-4 py-4 rounded-lg border-primary/20 bg-white text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all" type="text">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="border-t border-primary/10 px-10 py-6 bg-white flex justify-end gap-4">
        <a href="proveedores.html" class="px-8 py-3 rounded-lg border-2 border-primary/20 text-primary font-bold hover:bg-primary/5 transition-colors">Cancelar</a>
        <button type="submit" form="form-editar" id="btn-submit" class="px-8 py-3 rounded-lg bg-primary text-white font-bold shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all flex items-center gap-2">
            <span>💾</span> Actualizar Datos
        </button>
    </footer>
</div>

<!-- MODAL DE ÉXITO -->
<div id="modal-exito" class="fixed inset-0 flex items-center justify-center z-[60] hidden modal-mensaje">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl text-center">
        <div class="mx-auto mb-4"><span style="font-size:3rem;">✅</span></div>
        <h3 class="text-xl font-bold text-slate-900">¡Éxito!</h3>
        <p id="exito-mensaje" class="text-slate-500 mt-2"></p>
        <button id="btn-cerrar-exito" class="mt-6 w-full bg-primary text-white font-bold py-2 px-4 rounded-xl hover:bg-primary/90 transition-colors">Continuar</button>
    </div>
</div>

<!-- MODAL DE ERROR -->
<div id="modal-error" class="fixed inset-0 flex items-center justify-center z-[60] hidden modal-mensaje">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl text-center">
        <div class="mx-auto mb-4"><span style="font-size:3rem;">❌</span></div>
        <h3 class="text-xl font-bold text-slate-900">Error</h3>
        <p id="error-mensaje" class="text-slate-500 mt-2"></p>
        <button id="btn-cerrar-error" class="mt-6 w-full bg-primary text-white font-bold py-2 px-4 rounded-xl hover:bg-primary/90 transition-colors">Aceptar</button>
    </div>
</div>

<!-- MODAL DE VALIDACIÓN -->
<div id="modal-warning" class="fixed inset-0 flex items-center justify-center z-[60] hidden modal-mensaje">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl text-center">
        <div class="mx-auto mb-4"><span style="font-size:3rem;">⚠️</span></div>
        <h3 class="text-xl font-bold text-slate-900">Campos Incompletos</h3>
        <p id="warning-mensaje" class="text-slate-500 mt-2"></p>
        <button id="btn-cerrar-warning" class="mt-6 w-full bg-primary text-white font-bold py-2 px-4 rounded-xl hover:bg-primary/90 transition-colors">Aceptar</button>
    </div>
</div>

<script>
    const API_BASE = 'http://127.0.0.1:8000/api';
    const TOKEN = localStorage.token;

    if (!TOKEN) {
        const modal = document.getElementById('modal-error');
        document.getElementById('error-mensaje').innerText = 'No hay sesión activa. Redirigiendo al login...';
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-error').onclick = () => { window.location.href = '/index.html'; };
    }

    function getHeaders() {
        return { 'accept': 'application/json', 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
    }

    const urlParams = new URLSearchParams(window.location.search);
    const proveedorId = urlParams.get('id');
    if (!proveedorId) mostrarError('No se especificó qué proveedor editar.', true);

    function mostrarExito(mensaje, callback) {
        const modal = document.getElementById('modal-exito');
        document.getElementById('exito-mensaje').innerText = mensaje;
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-exito').onclick = () => { modal.classList.add('hidden'); if (callback) callback(); };
    }

    function mostrarError(mensaje, redirigir = false) {
        const modal = document.getElementById('modal-error');
        document.getElementById('error-mensaje').innerText = mensaje;
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-error').onclick = () => { modal.classList.add('hidden'); if (redirigir) window.location.href = 'proveedores.html'; };
    }

    function mostrarWarning(mensaje) {
        const modal = document.getElementById('modal-warning');
        document.getElementById('warning-mensaje').innerText = mensaje;
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-warning').onclick = () => modal.classList.add('hidden');
    }

    async function cargarProveedor() {
        try {
            const res = await fetch(`${API_BASE}/proveedor/${proveedorId}`, { headers: getHeaders() });
            if (!res.ok) throw new Error(`Error ${res.status}`);
            const proveedor = await res.json();
            document.getElementById('id_proveedor').value = proveedor.id_proveedor;
            document.getElementById('descripcion').value = proveedor.descripcion || '';
            document.getElementById('direccion').value = proveedor.direccion || '';
            document.getElementById('contacto').value = proveedor.contacto || '';
        } catch (error) {
            mostrarError('Error al cargar los datos: ' + error.message, true);
        }
    }

    const form = document.getElementById('form-editar');
    const submitBtn = document.getElementById('btn-submit');

    async function actualizarProveedor(event) {
        event.preventDefault();
        const descripcion = document.getElementById('descripcion').value.trim();
        const direccion = document.getElementById('direccion').value.trim();
        const contacto = document.getElementById('contacto').value.trim();
        if (!descripcion) { mostrarWarning('La descripción es obligatoria'); return; }
        const datos = { descripcion, direccion: direccion || null, contacto: contacto || null };
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '⏳ Actualizando...';
        submitBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/proveedor/${proveedorId}`, { method: 'PUT', headers: getHeaders(), body: JSON.stringify(datos) });
            if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Error al actualizar'); }
            mostrarExito('Proveedor actualizado correctamente.', () => { window.location.href = 'proveedores.html'; });
        } catch (error) {
            let errorMsg = error.message;
            if (errorMsg.includes('duplicate') || errorMsg.toLowerCase().includes('unique')) errorMsg = 'Ya existe un proveedor con ese nombre.';
            mostrarError('Error al actualizar: ' + errorMsg);
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    }

    form.addEventListener('submit', actualizarProveedor);
    cargarProveedor();
</script>
</body>
</html>
