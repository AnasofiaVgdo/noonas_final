<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Editar Cliente - Nonna</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: { "primary": "#5d1927", "accent-pink": "#FEBDC6" },
                fontFamily: { "sans": ["Montserrat", "sans-serif"] },
                borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
            },
        },
    }
</script>
<style>
    body { font-family: "Montserrat", sans-serif; background-color: #FEBDC6; }
    .modal-mensaje {
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
</style>
</head>
<body class="bg-[#FEBDC6] min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-[1280px] max-h-[960px] rounded-2xl shadow-2xl overflow-hidden flex flex-col">

    <header class="flex items-center justify-between border-b border-slate-100 px-10 py-6 bg-white">
        <div class="flex items-center gap-4">
            <div class="bg-primary/10 p-3 rounded-xl text-primary">
                <span class="material-symbols-outlined text-3xl">person_edit</span>
            </div>
            <div>
                <h1 class="text-slate-900 text-2xl font-extrabold tracking-tight">Editar Datos del Cliente</h1>
                <p class="text-slate-500 text-sm">Modifique la información del perfil y las direcciones del cliente.</p>
            </div>
        </div>
        <a href="clientes.html" class="text-slate-400 hover:text-slate-600 transition-colors">
            <span class="material-symbols-outlined">close</span>
        </a>
    </header>

    <main class="flex-1 overflow-y-auto p-10 bg-slate-50/50">
        <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Datos básicos -->
            <section class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-outlined text-primary">info</span>
                    <h2 class="text-lg font-bold text-slate-900">Información Básica</h2>
                </div>
                <div class="grid grid-cols-1 gap-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-slate-700">ID Cliente (No editable)</label>
                        <input id="id_cliente" class="w-full rounded-xl border-slate-200 bg-slate-100 px-4 py-3 text-slate-400 cursor-not-allowed" readonly>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-slate-700">Nombre *</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                            <input id="nombre" class="w-full rounded-xl border-slate-200 bg-slate-50 pl-11 pr-4 py-3 text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Ej. María" type="text" required>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-slate-700">Apellido *</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">badge</span>
                            <input id="apellido" class="w-full rounded-xl border-slate-200 bg-slate-50 pl-11 pr-4 py-3 text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Ej. García" type="text" required>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-slate-700">Teléfono</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">phone</span>
                            <input id="telefono" class="w-full rounded-xl border-slate-200 bg-slate-50 pl-11 pr-4 py-3 text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="000 000 0000" type="text">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Direcciones -->
            <section class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">location_on</span>
                        <h2 class="text-lg font-bold text-slate-900">Direcciones del Cliente</h2>
                    </div>
                    <button id="btn-agregar-direccion" class="flex items-center gap-2 text-sm font-bold text-primary hover:text-primary/80 transition-colors">
                        <span class="material-symbols-outlined text-lg">add_circle</span> Agregar
                    </button>
                </div>
                <div id="lista-direcciones" class="space-y-3">
                    <p class="text-slate-400 text-sm">Cargando direcciones...</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="border-t border-slate-100 p-8 flex justify-end gap-4 bg-white">
        <a href="clientes.html" class="px-8 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-all">Cancelar</a>
        <button id="btn-guardar" class="px-10 py-3 rounded-xl bg-primary text-white font-bold hover:bg-primary/95 transition-all shadow-lg shadow-primary/30 flex items-center gap-2">
            <span class="material-symbols-outlined">check_circle</span> Guardar Cambios
        </button>
    </footer>
</div>

<!-- MODALES CENTRALES -->
<div id="modal-exito" class="fixed inset-0 flex items-center justify-center z-[60] hidden modal-mensaje">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl text-center">
        <div class="mx-auto mb-4"><span class="material-symbols-outlined text-green-600 text-5xl">check_circle</span></div>
        <h3 id="exito-titulo" class="text-xl font-bold text-slate-900">¡Éxito!</h3>
        <p id="exito-mensaje" class="text-slate-500 mt-2"></p>
        <button id="btn-cerrar-exito" class="mt-6 w-full bg-primary text-white font-bold py-2 px-4 rounded-xl hover:bg-primary/90 transition-colors">Continuar</button>
    </div>
</div>

<div id="modal-error" class="fixed inset-0 flex items-center justify-center z-[60] hidden modal-mensaje">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl text-center">
        <div class="mx-auto mb-4"><span class="material-symbols-outlined text-red-600 text-5xl">error</span></div>
        <h3 class="text-xl font-bold text-slate-900">Error</h3>
        <p id="error-mensaje" class="text-slate-500 mt-2"></p>
        <button id="btn-cerrar-error" class="mt-6 w-full bg-primary text-white font-bold py-2 px-4 rounded-xl hover:bg-primary/90 transition-colors">Aceptar</button>
    </div>
</div>

<div id="modal-warning" class="fixed inset-0 flex items-center justify-center z-[60] hidden modal-mensaje">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl text-center">
        <div class="mx-auto mb-4"><span class="material-symbols-outlined text-amber-600 text-5xl">warning</span></div>
        <h3 class="text-xl font-bold text-slate-900">Aviso</h3>
        <p id="warning-mensaje" class="text-slate-500 mt-2"></p>
        <button id="btn-cerrar-warning" class="mt-6 w-full bg-primary text-white font-bold py-2 px-4 rounded-xl hover:bg-primary/90 transition-colors">Aceptar</button>
    </div>
</div>

<script>
    const API_BASE = 'http://127.0.0.1:8000/api';
    const TOKEN = localStorage.token;

    function getHeaders() {
        return { 'accept': 'application/json', 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
    }

    function mostrarExito(mensaje, callback) {
        const modal = document.getElementById('modal-exito');
        document.getElementById('exito-titulo').innerText = '¡Éxito!';
        document.getElementById('exito-mensaje').innerText = mensaje;
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-exito').onclick = () => {
            modal.classList.add('hidden');
            if (callback) callback();
        };
    }

    function mostrarError(mensaje) {
        const modal = document.getElementById('modal-error');
        document.getElementById('error-mensaje').innerText = mensaje;
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-error').onclick = () => modal.classList.add('hidden');
    }

    function mostrarWarning(mensaje) {
        const modal = document.getElementById('modal-warning');
        document.getElementById('warning-mensaje').innerText = mensaje;
        modal.classList.remove('hidden');
        document.getElementById('btn-cerrar-warning').onclick = () => modal.classList.add('hidden');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const clienteId = urlParams.get('id');
    if (!clienteId) {
        mostrarWarning('No se especificó qué cliente editar.');
        setTimeout(() => { window.location.href = 'clientes.html'; }, 2000);
    }

    async function cargarCliente() {
        try {
            const res = await fetch(`${API_BASE}/cliente/${clienteId}`, { headers: getHeaders() });
            if (!res.ok) throw new Error(`Error ${res.status}`);
            const cliente = await res.json();
            document.getElementById('id_cliente').value = cliente.id_cliente;
            document.getElementById('nombre').value = cliente.nombre || '';
            document.getElementById('apellido').value = cliente.apellido || '';
            document.getElementById('telefono').value = cliente.telefono || '';
        } catch (error) { 
            mostrarError('Error al cargar cliente: ' + error.message);
            setTimeout(() => { window.location.href = 'clientes.html'; }, 2000);
        }
    }

    async function cargarDirecciones() {
        const container = document.getElementById('lista-direcciones');
        container.innerHTML = '<p class="text-slate-400 text-sm">Cargando direcciones...</p>';
        try {
            const res = await fetch(`${API_BASE}/direccion/`, { headers: getHeaders() });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const todas = await res.json();
            const misDirecciones = todas.filter(d => d.id_cliente == clienteId);
            if (misDirecciones.length === 0) { 
                container.innerHTML = '<p class="text-slate-400 text-sm">No hay direcciones registradas para este cliente.</p>'; 
                return; 
            }
            container.innerHTML = '';
            misDirecciones.forEach(dir => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100';
                div.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-primary mt-0.5">home</span>
                        <div>
                            <p class="font-bold text-slate-700 text-sm">Dirección</p>
                            <p class="text-xs text-slate-500">${escapeHtml(dir.descripcion)}</p>
                        </div>
                    </div>
                    <button class="eliminar-direccion text-slate-300 hover:text-red-500 transition-colors" data-id="${dir.id_direccion}">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                `;
                container.appendChild(div);
            });
            document.querySelectorAll('.eliminar-direccion').forEach(btn => {
                btn.addEventListener('click', async () => {
                    mostrarWarning('¿Eliminar esta dirección? Esta acción no se puede deshacer.');
                    const confirmar = confirm('¿Estás seguro de eliminar esta dirección?');
                    if (!confirmar) return;
                    try {
                        const delRes = await fetch(`${API_BASE}/direccion/${btn.dataset.id}`, { method: 'DELETE', headers: getHeaders() });
                        if (!delRes.ok) { const errData = await delRes.json(); throw new Error(errData.detail || 'Error al eliminar'); }
                        mostrarExito('Dirección eliminada correctamente', () => {
                            cargarDirecciones();
                        });
                    } catch(e) { mostrarError('Error al eliminar dirección: ' + e.message); }
                });
            });
        } catch (error) {
            container.innerHTML = `<p class="text-red-500 text-sm">Error al cargar direcciones: ${error.message}</p>`;
            mostrarError('Error al cargar direcciones: ' + error.message);
        }
    }

    function mostrarModalAgregarDireccion() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4';
        modalDiv.innerHTML = `
            <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
                <div class="flex items-center gap-3 mb-6">
                    <span class="material-symbols-outlined text-primary">add_location</span>
                    <h3 class="text-xl font-bold text-slate-900">Nueva Dirección</h3>
                </div>
                <textarea id="nueva-descripcion" class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" rows="3" placeholder="Calle, número, colonia, ciudad, CP..."></textarea>
                <div class="flex justify-end gap-3 mt-6">
                    <button id="cancelar-modal" class="px-6 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-all">Cancelar</button>
                    <button id="confirmar-modal" class="px-8 py-2 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">add</span> Guardar
                    </button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        modalDiv.querySelector('#cancelar-modal').onclick = () => modalDiv.remove();
        modalDiv.querySelector('#confirmar-modal').onclick = async () => {
            const descripcion = modalDiv.querySelector('#nueva-descripcion').value.trim();
            if (!descripcion) { mostrarWarning('La dirección es obligatoria'); return; }
            try {
                const res = await fetch(`${API_BASE}/direccion/`, { method: 'POST', headers: getHeaders(), body: JSON.stringify({ id_cliente: parseInt(clienteId), descripcion }) });
                if (!res.ok) { const errData = await res.json(); throw new Error(errData.detail || 'Error al guardar'); }
                mostrarExito('Dirección agregada correctamente', () => {
                    modalDiv.remove();
                    cargarDirecciones();
                });
            } catch(e) { mostrarError('Error al guardar dirección: ' + e.message); }
        };
    }

    async function actualizarCliente() {
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        if (!nombre || !apellido) { 
            mostrarWarning('Nombre y apellido son obligatorios'); 
            return; 
        }

        const btn = document.getElementById('btn-guardar');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span> Guardando...';
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/cliente/${clienteId}`, { method: 'PUT', headers: getHeaders(), body: JSON.stringify({ nombre, apellido, telefono }) });
            if (!res.ok) { 
                const err = await res.json(); 
                throw new Error(err.detail || 'Error al actualizar'); 
            }
            mostrarExito('Cliente actualizado correctamente', () => {
                window.location.href = 'clientes.html';
            });
        } catch (error) {
            mostrarError('Error: ' + error.message);
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        }
    }

    document.getElementById('btn-guardar').addEventListener('click', actualizarCliente);
    document.getElementById('btn-agregar-direccion').addEventListener('click', mostrarModalAgregarDireccion);

    function escapeHtml(str) { 
        if (!str) return ''; 
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); 
    }

    cargarCliente();
    cargarDirecciones();
</script>
</body>
</html>
