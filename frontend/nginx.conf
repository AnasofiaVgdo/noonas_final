server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Existing pages contain local development URLs. Replace them in the
    # response so browser requests stay on this Nginx origin.
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript;
    sub_filter 'http://127.0.0.1:8000' '';
    sub_filter 'http://localhost:8000' '';

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ @legacy_page;
    }

    # The pages were moved to /pages. Keep previous root-level URLs working
    # while bookmarks and links are gradually updated.
    location @legacy_page {
        try_files /pages$uri =404;
    }
}
